<div class="tk">
  <div class="tk-body">
    <fieldset>
      <legend>Search</legend>
      <div class="tk-row">
        <label class="tk-fld" for="httpstatus-q"><b>Type to filter</b>
          <input type="text" id="httpstatus-q" class="xp-field" maxlength="80" placeholder="e.g. 502, timeout or redirect" autocomplete="off" spellcheck="false"></label>
        <span class="tk-muted" id="httpstatus-count" role="status" aria-live="polite"></span>
      </div>
      <p class="tk-muted" id="httpstatus-intro"></p>
    </fieldset>
    <div id="httpstatus-out"></div>
  </div>
  <footer class="statusbar" role="status" aria-live="polite"><span class="cell msg" id="httpstatus-status">Ready</span></footer>
</div>
