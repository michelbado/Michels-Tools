<div class="gm">
  <div class="gm-bar">
    <button type="button" class="xp-btn small is-default" id="racer-new">New race</button>
    <button type="button" class="xp-btn small" id="racer-pause">Pause</button>
    <button type="button" class="xp-btn small gm-sound" id="racer-sound" aria-pressed="false">Sound: off</button>
    <span class="gm-info" id="racer-info"></span>
  </div>
  <div class="gm-stage" id="racer-stage"><canvas class="gm-canvas" id="racer-canvas" tabindex="0" aria-label="Road Racer game"></canvas></div>
  <div class="gm-pad">
    <button type="button" class="xp-btn" data-key="ArrowLeft" aria-label="Steer left">&#9664;</button>
    <button type="button" class="xp-btn gm-wide" data-key="ArrowDown">Brake</button>
    <button type="button" class="xp-btn gm-wide" data-key="ArrowUp">Gas</button>
    <button type="button" class="xp-btn" data-key="ArrowRight" aria-label="Steer right">&#9654;</button>
  </div>
  <footer class="statusbar" role="status"><span class="cell msg" id="racer-status">Up arrow: gas. Down: brake. Left and Right: steer. Reach each checkpoint before the clock runs out.</span></footer>
</div>
