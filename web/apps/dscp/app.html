<div class="tk">
  <div class="tk-body">
    <fieldset>
      <legend>Search</legend>
      <div class="tk-row">
        <label class="tk-fld" for="dscp-q"><b>Type to filter</b>
          <input type="text" id="dscp-q" class="xp-field" maxlength="80" placeholder="e.g. EF, 46 or voice" autocomplete="off" spellcheck="false"></label>
        <span class="tk-muted" id="dscp-count" role="status" aria-live="polite"></span>
      </div>
      <p class="tk-muted" id="dscp-intro"></p>
    </fieldset>
    <div id="dscp-out"></div>
  </div>
  <footer class="statusbar" role="status" aria-live="polite"><span class="cell msg" id="dscp-status">Ready</span></footer>
</div>
