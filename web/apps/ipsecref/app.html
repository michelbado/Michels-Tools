<div class="tk">
  <div class="tk-body">
    <fieldset>
      <legend>Search</legend>
      <div class="tk-row">
        <label class="tk-fld" for="ipsecref-q"><b>Type to filter</b>
          <input type="text" id="ipsecref-q" class="xp-field" maxlength="80" placeholder="e.g. group 20, SHA384 or NAT-T" autocomplete="off" spellcheck="false"></label>
        <span class="tk-muted" id="ipsecref-count" role="status" aria-live="polite"></span>
      </div>
      <p class="tk-muted" id="ipsecref-intro"></p>
    </fieldset>
    <div id="ipsecref-out"></div>
  </div>
  <footer class="statusbar" role="status" aria-live="polite"><span class="cell msg" id="ipsecref-status">Ready</span></footer>
</div>
