<div class="gm">
  <div class="gm-bar">
    <button type="button" class="xp-btn small is-default" id="birdhunt-new">New game</button>
    <button type="button" class="xp-btn small" id="birdhunt-pause">Pause</button>
    <button type="button" class="xp-btn small gm-sound" id="birdhunt-sound" aria-pressed="false">Sound: off</button>
    <span class="gm-info" id="birdhunt-info"></span>
  </div>
  <div class="gm-stage" id="birdhunt-stage"><canvas class="gm-canvas" id="birdhunt-canvas" tabindex="0" aria-label="Bird Hunt game"></canvas></div>
  <footer class="statusbar" role="status"><span class="cell msg" id="birdhunt-status">Birds burst out of the grass without warning. Click (or tap) to shoot: three shots for each flight.</span></footer>
</div>
