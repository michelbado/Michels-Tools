<div class="tk">
  <div class="tk-body">
    <fieldset>
      <legend>Search</legend>
      <div class="tk-row">
        <label class="tk-fld" for="tcpref-q"><b>Type to filter</b>
          <input type="text" id="tcpref-q" class="xp-field" maxlength="80" placeholder="e.g. RST, TIME-WAIT or window" autocomplete="off" spellcheck="false"></label>
        <span class="tk-muted" id="tcpref-count" role="status" aria-live="polite"></span>
      </div>
      <p class="tk-muted" id="tcpref-intro"></p>
    </fieldset>
    <div id="tcpref-out"></div>
  </div>
  <footer class="statusbar" role="status" aria-live="polite"><span class="cell msg" id="tcpref-status">Ready</span></footer>
</div>
