<div class="gm">
  <div class="gm-bar">
    <button type="button" class="xp-btn small is-default" id="pinball-new">New game</button>
    <button type="button" class="xp-btn small" id="pinball-pause">Pause</button>
    <button type="button" class="xp-btn small gm-sound" id="pinball-sound" aria-pressed="false">Sound: off</button>
    <span class="gm-info" id="pinball-info"></span>
  </div>
  <div class="gm-stage" id="pinball-stage"><canvas class="gm-canvas" id="pinball-canvas" tabindex="0" aria-label="Pinball game"></canvas></div>
  <footer class="statusbar" role="status"><span class="cell msg" id="pinball-status">Hold Space and let go to launch the ball. Left and Right arrows (or Z and M) work the flippers. On a touch screen: tap the left or right half.</span></footer>
</div>
