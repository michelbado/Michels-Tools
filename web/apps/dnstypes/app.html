<div class="tk">
  <div class="tk-body">
    <fieldset>
      <legend>Search</legend>
      <div class="tk-row">
        <label class="tk-fld" for="dnstypes-q"><b>Type to filter</b>
          <input type="text" id="dnstypes-q" class="xp-field" maxlength="80" placeholder="e.g. MX, 28 or alias" autocomplete="off" spellcheck="false"></label>
        <span class="tk-muted" id="dnstypes-count" role="status" aria-live="polite"></span>
      </div>
      <p class="tk-muted" id="dnstypes-intro"></p>
    </fieldset>
    <div id="dnstypes-out"></div>
  </div>
  <footer class="statusbar" role="status" aria-live="polite"><span class="cell msg" id="dnstypes-status">Ready</span></footer>
</div>
