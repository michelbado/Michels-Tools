<div class="gm">
  <div class="gm-bar">
    <button type="button" class="xp-btn small is-default" id="blocks-new">New game</button>
    <button type="button" class="xp-btn small" id="blocks-pause">Pause</button>
    <button type="button" class="xp-btn small gm-sound" id="blocks-sound" aria-pressed="false">Sound: off</button>
    <span class="gm-info" id="blocks-info"></span>
  </div>
  <div class="gm-stage" id="blocks-stage"><canvas class="gm-canvas" id="blocks-canvas" tabindex="0" aria-label="Blocks game"></canvas></div>
  <div class="gm-pad">
    <button type="button" class="xp-btn" data-key="ArrowLeft" aria-label="Left">&#9664;</button>
    <button type="button" class="xp-btn" data-key="ArrowRight" aria-label="Right">&#9654;</button>
    <button type="button" class="xp-btn" data-key="ArrowUp" aria-label="Turn">&#10227;</button>
    <button type="button" class="xp-btn" data-key="ArrowDown" aria-label="Down">&#9660;</button>
    <button type="button" class="xp-btn gm-wide" data-key="Space">Drop</button>
    <button type="button" class="xp-btn gm-wide" data-key="KeyC">Hold</button>
  </div>
  <footer class="statusbar" role="status"><span class="cell msg" id="blocks-status">Arrows move and turn, Space drops, C keeps a piece for later, P pauses.</span></footer>
</div>
