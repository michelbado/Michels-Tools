<div class="tk">
  <div class="tk-body">
    <fieldset>
      <legend>An address or a number</legend>
      <textarea class="xp-text tk-in" id="ipconv-in" rows="2" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="192.168.1.1">192.168.1.1</textarea>
      <p class="tk-muted">Paste any of: an IPv4 or IPv6 address, a decimal number (3232235777), hex (0xC0A80101), binary, an unusual form like 0300.0250.0.1 or 192.168.257, or a reverse DNS name (1.1.168.192.in-addr.arpa or an ip6.arpa name). Everything is worked out in your browser.</p>
    </fieldset>
    <div class="tk-summary" id="ipconv-summary" role="status" aria-live="polite"></div>
    <ul class="tk-notes" id="ipconv-notes" hidden></ul>
    <div id="ipconv-sections"></div>
  </div>
  <footer class="statusbar" role="status" aria-live="polite"><span class="cell msg" id="ipconv-status">Ready</span></footer>
</div>
